name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [ self-hosted, windows, dataflex ]
    steps:
    - uses: actions/checkout@v7
      with:
        clean: true
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - name: Verify DataFlex toolchain
      run: df-cli system
    - name: Set package version from tag
      shell: pwsh
      run: |
        $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
        "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        $path = 'WebAPIs.sws'
        $content = [System.IO.File]::ReadAllText($path)

        $pattern = '"version"\s*:\s*"[^"]*"'
        $matchCount = [regex]::Matches($content, $pattern).Count
        if ($matchCount -ne 1) {
          throw "Expected exactly one 'version' field in $path, found $matchCount - refusing to guess which one to update"
        }

        $updated = [regex]::Replace($content, $pattern, "`"version`": `"$VERSION`"")
        [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))
    - name: Validate workspace configuration
      run: df-cli config WebAPIs.sws
    - name: Build demo workspace
      run: df-cli build "Demo/WebAPIs Demo.sws"
    - name: Pack and push package
      shell: pwsh
      run: |
        df-cli package pack WebAPIs.sws
        df-cli package push WebAPIs.sws "Kruse-Net/WebAPIs" -y 2>&1 | Tee-Object -FilePath df-push.log
        if (Select-String -Path df-push.log -Pattern "error|failed|conflict" -Quiet) {
          Write-Host "::error::Package push reported a failure - check df-push.log"
          exit 1
        }
    - name: Build demo zip
      run: npm run zip-demo
    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        path: WebAPIs-${{ env.VERSION }}.zip
        archive: false
    - name: Upload demo artifact
      uses: actions/upload-artifact@v7
      with:
        path: dist/WebAPIsDemo.zip
        archive: false
    - name: Commit version bump
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add WebAPIs.sws
        git diff --cached --quiet
        if ($LASTEXITCODE -ne 0) {
          git commit -m "chore(release): set package version to $env:VERSION"
          git push origin HEAD:main
        } else {
          Write-Host "No changes to commit"
        }
    - name: Create GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete "v$env:VERSION" --force *> $null
        gh release create "v$env:VERSION" --title "WebAPIs $env:VERSION" --generate-notes "WebAPIs-$env:VERSION.zip" "dist/WebAPIsDemo.zip"
