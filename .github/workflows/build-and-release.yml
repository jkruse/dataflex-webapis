name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [ self-hosted, windows, dataflex ]
    steps:
    - uses: actions/checkout@v7
      with:
        clean: 'true'
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - name: Verify DataFlex toolchain
      run: df-cli system
    - name: Set package version from tag
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        node -e "const fs=require('fs');const f='WebAPIs.sws';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.package.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,4)+'\n')" "$VERSION"
    - name: Validate workspace configuration
      run: df-cli config WebAPIs.sws
    - name: Build demo workspace
      run: df-cli build "Demo/WebAPIs Demo.sws"
    - name: Push package
      shell: bash
      run: |
        df-cli package push WebAPIs.sws "Kruse-Net/WebAPIs" -y 2>&1 | tee df-push.log
        if grep -qiE "error|failed|conflict" df-push.log; then
          echo "::error::Package push reported a failure - check df-push.log"
          exit 1
        fi
    - name: Build demo zip
      run: npm run zip-demo
    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        path: WebAPIs-${{ env.VERSION }}.zip
        archive: false
    - name: Upload demo artifact
      uses: actions/upload-artifact@v7
      with:
        path: dist/WebAPIsDemo.zip
        archive: false
    - name: Commit version bump
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add WebAPIs.sws
        if ! git diff --cached --quiet; then
          git commit -m "chore(release): set package version to $VERSION"
        fi
        git push
    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete "v$VERSION" --force >/dev/null 2>&1 || true
        gh release create "v$VERSION" --title "WebAPIs $VERSION" --generate-notes "WebAPIs-$VERSION.zip" "dist/WebAPIsDemo.zip"
